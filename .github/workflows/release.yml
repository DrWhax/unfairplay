name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Test IDA loader with synthetic fixtures
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s integrations/ida/tests -v
      - name: Test Binary Ninja loader with synthetic fixtures
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s integrations/binaryninja/tests -v

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            extension: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            extension: ""
            archive: tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p staging
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "staging/unfairplay${{ matrix.extension }}" \
            ./cmd/unfairplay
          cp LICENSE LICENSE-DARKPHOENIX.txt LICENSE-MACOSFAIRFREE.txt NOTICE README.md staging/
          mkdir -p staging/integrations/ida
          cp integrations/ida/unfairplay_ipa.py integrations/ida/README.md staging/integrations/ida/
          mkdir -p staging/integrations/binaryninja
          cp integrations/binaryninja/__init__.py integrations/binaryninja/plugin.json integrations/binaryninja/README.md staging/integrations/binaryninja/
          cp integrations/ida/unfairplay_ipa.py LICENSE staging/integrations/binaryninja/

      - name: Smoke test native binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          VERSION: ${{ github.ref_name }}
        run: test "$(./staging/unfairplay --version)" = "unfairplay version ${VERSION}"

      - name: Package tarball
        if: matrix.archive == 'tar.gz'
        env:
          ASSET: unfairplay-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
        run: |
          mv staging "${ASSET}"
          tar -czf "${ASSET}.tar.gz" "${ASSET}"

      - name: Verify packaged notices and disassembler loaders
        if: matrix.archive == 'tar.gz'
        env:
          ASSET: unfairplay-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
        run: |
          for file in LICENSE LICENSE-DARKPHOENIX.txt LICENSE-MACOSFAIRFREE.txt NOTICE README.md integrations/ida/unfairplay_ipa.py integrations/ida/README.md integrations/binaryninja/__init__.py integrations/binaryninja/plugin.json integrations/binaryninja/README.md; do
            tar -xOf "${ASSET}.tar.gz" "${ASSET}/${file}" | cmp "${file}" -
          done
          tar -xOf "${ASSET}.tar.gz" "${ASSET}/integrations/binaryninja/unfairplay_ipa.py" | cmp integrations/ida/unfairplay_ipa.py -
          tar -xOf "${ASSET}.tar.gz" "${ASSET}/integrations/binaryninja/LICENSE" | cmp LICENSE -

      - name: Upload packaged binary
        uses: actions/upload-artifact@v7
        with:
          name: unfairplay-${{ matrix.goos }}-${{ matrix.goarch }}
          path: unfairplay-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs:
      - test
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "${TAG}" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "${TAG}" release-assets/* \
            --repo "${GH_REPO}" \
            --verify-tag \
            --generate-notes \
            --title "UnfairPlay ${TAG}" \
            "${prerelease[@]}"
